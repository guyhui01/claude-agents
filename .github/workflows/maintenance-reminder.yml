name: claude-agents catalog maintenance

# ─── Triggers ────────────────────────────────────────────────────────────────
#
#  SCHEDULE  → creates a lightweight REMINDER issue (you decide whether to run)
#  MANUAL    → you launch it yourself from Actions → creates the full checklist
#
on:
  schedule:
    # Automatic reminders — Jan 1, Apr 1, Jul 1, Oct 1 at 9am UTC (10am Paris)
    - cron: '0 9 1 1 *'   # Q1 — January 1
    - cron: '0 9 1 4 *'   # Q2 — April 1
    - cron: '0 9 1 7 *'   # Q3 — July 1
    - cron: '0 9 1 10 *'  # Q4 — October 1

  # Manual launch from: GitHub → Actions tab → Run workflow
  workflow_dispatch:
    inputs:
      type_revision:
        description: 'Review level to perform'
        required: true
        default: 'quarterly'
        type: choice
        options:
          - quarterly            # 15-30 min — LLM models only
          - semiannual           # 2-3h — models + AI skills + MCP servers
          - annual               # 3-4h — full review + certifications

# ─── Job 1 — automatic REMINDER (schedule only) ──────────────────────────────
jobs:
  rappel-schedule:
    name: Create the maintenance reminder
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create the reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const now     = new Date();
            const month   = now.getMonth() + 1;
            const year    = now.getFullYear();
            const quarter = Math.ceil(month / 3);

            const isSemiAnnual = quarter === 2 || quarter === 4;
            const isAnnual     = quarter === 4;

            const revisionType = isAnnual
              ? '📋 annual (models + skills + certifications)'
              : isSemiAnnual
                ? '🔬 semiannual (models + AI skills)'
                : '✅ quarterly (LLM models)';

            const duree  = isAnnual ? '3-4h' : isSemiAnnual ? '2-3h' : '15-30 min';
            const niveau = isAnnual ? 'annual' : isSemiAnnual ? 'semiannual' : 'quarterly';

            const actionUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/maintenance-reminder.yml`;

            // Body built as an array of lines (.join): each line stays indented
            // INSIDE the YAML `script: |` block, while producing markdown with
            // no stray indentation at the issue root.
            const body = [
              `# 🔔 Catalog maintenance reminder — Q${quarter} ${year}`,
              '',
              '> Automatic reminder — **no action has been performed automatically.**',
              '> You decide when to run the maintenance.',
              '',
              '## What is due this quarter',
              '',
              `**${revisionType}** review`,
              `Estimated duration: **${duree}**`,
              '',
              '## To run the maintenance',
              '',
              `1. Go to: [Actions → maintenance-reminder.yml](${actionUrl})`,
              '2. Click **"Run workflow"**',
              `3. Pick the level: \`${niveau}\``,
              '4. Launch → an issue with the full checklist will be created',
              '',
              '---',
              '*Close this issue once the maintenance is done.*',
            ].join('\n');

            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🔔 Maintenance reminder — Q${quarter} ${year} (${revisionType})`,
              body:  body,
            });

            console.log(`Reminder created: ${response.data.html_url}`);

# ─── Job 2 — full CHECKLIST (workflow_dispatch only) ─────────────────────────
  checklist-manuelle:
    name: Create the maintenance checklist
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create the issue with the full checklist
        uses: actions/github-script@v7
        with:
          script: |
            const now     = new Date();
            const month   = now.getMonth() + 1;
            const year    = now.getFullYear();
            const quarter = Math.ceil(month / 3);
            const type    = context.payload.inputs.type_revision;

            const isSemiAnnual = type === 'semiannual' || type === 'annual';
            const isAnnual     = type === 'annual';

            // ── Quarterly checklist (always included) ────────────────────────
            const quarterly = [
              '## ✅ QUARTERLY review — LLM models',
              '',
              '- [ ] Check the `modele_recommande` in the 10 workflows (`workflows/WF-0*.md`)',
              '- [ ] Check the model ids in the 38 `AGENT-*.md` agents',
              '- [ ] Update the LLM benchmark in `skills/veille_strategique/benchmark-outils-ia.md`',
              '- [ ] Check whether an Anthropic model was deprecated or a new one announced',
              '      → https://docs.anthropic.com/en/docs/about-claude/models/overview',
              '- [ ] Grep to spot stale references in the repo:',
              '      ```',
              '      grep -r "GPT-4\\|Gemini 1.5\\|claude-2\\|claude-3-opus\\|claude-3-sonnet" --include="*.md" .',
              '      ```',
            ];

            // ── Semiannual checklist ─────────────────────────────────────────
            const semiAnnual = isSemiAnnual ? [
              '',
              '## 🔬 SEMIANNUAL review — AI skills & techniques',
              '',
              '### Folders to re-read first',
              '- [ ] `skills/prompt_engineer/` — CoT, RAG, multimodal patterns still current?',
              '- [ ] `skills/dev_ia/` — Anthropic SDK, LangChain, MCP: new major versions?',
              '- [ ] `skills/orchestrateur_workflow/` — multi-agent patterns, LangGraph, CrewAI: changes?',
              '- [ ] `skills/securite_ia/` — OWASP LLM Top 10: new version published?',
              '- [ ] `skills/devops_cloud/` — Terraform, Kubernetes, GitHub Actions: breaking changes?',
              '',
              '### MCP servers — npm dependencies',
              '- [ ] `cd mcp-servers/mcp-jira && npm outdated`',
              '- [ ] `cd mcp-servers/mcp-confluence && npm outdated`',
              '- [ ] `cd mcp-servers/mcp-workflow-log && npm outdated`',
              '',
              '### Agent catalog',
              '- [ ] Identify whether a new agent should be created (WF-005 signals from the last 6 months)',
              '- [ ] Check whether an agent became redundant or obsolete',
              '- [ ] Update `README.md` if the counters changed',
            ] : [];

            // ── Annual checklist ─────────────────────────────────────────────
            const annual = isAnnual ? [
              '',
              '## 📋 ANNUAL review — certifications & methodologies',
              '',
              '### Agile & management certifications',
              '- [ ] **SAFe** — new version? → https://scaledagile.com/blog/safe-release-notes/',
              '      If SAFe 7+: update RTE, PM-SAFE, PO-SAFE, SCRUM-MASTER, ORCHESTRATEUR',
              '- [ ] **PMI** (PMP, PMI-ACP, PMI-PBA) — major revision of the PMBOK body of knowledge?',
              '- [ ] **ISTQB** — new version of the Foundation / Agile Tester syllabus?',
              '- [ ] **PROSCI** — ADKAR model update or new certification?',
              '- [ ] **SCIP** — framework evolution or new certifications?',
              '',
              '### Technical certifications',
              '- [ ] **Anthropic** — new certifications? → https://www.anthropic.com/learn',
              '- [ ] **AWS / GCP / Azure** — new SA, ML, Security certifications?',
              '- [ ] **CKA / CKAD** — new version of the Kubernetes curriculum?',
              '',
              '### Full audit',
              '- [ ] Re-read the 10 workflows: agent compositions still optimal?',
              '- [ ] Re-read the 3 MCP servers: relevant tools, missing integrations?',
              '- [ ] Full `README.md` audit: sections, links, counters',
              '- [ ] Archive or remove obsolete agents/skills',
              '- [ ] Update `version:` in the modified YAML files (e.g. 1.1 → 1.2)',
            ] : [];

            const duree = isAnnual ? '3-4h' : isSemiAnnual ? '2-3h' : '15-30 min';
            const label = isAnnual
              ? '📋 Annual'
              : isSemiAnnual
                ? '🔬 Semiannual'
                : '✅ Quarterly';

            const body = [
              `# 🔧 Catalog maintenance — Q${quarter} ${year} (${label})`,
              '',
              `> Launched manually on ${now.toLocaleDateString('en-US')} · Estimated duration: **${duree}**`,
              '',
              ...quarterly,
              ...semiAnnual,
              ...annual,
              '',
              '---',
              '',
              '**Watch workflow:** run WF-005 if signals were captured since the last review',
              '**Model reference:** https://docs.anthropic.com/en/docs/about-claude/models/overview',
              '*Close this issue once every box is checked.*',
            ].join('\n');

            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🔧 Catalog maintenance — Q${quarter} ${year} (${label})`,
              body:  body,
            });

            console.log(`Checklist created: ${response.data.html_url}`);
