name: sidecar

# Sidecar validation on the CATALOG side (ADR-0003): the generator and its
# validation belong to this repo; the runtime only reads the produced sidecar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # committed sidecar.json: valid (ajv schema + integrity) AND up to date vs the prose
      - run: npm run validate:sidecar
      # "Agents" column of both READMEs consistent with the WF identity cards
      - run: npm run validate:wf-agents
      # drift-check: cleanly skipped in CI (runtime not checked out); active locally
      - run: npm run check:schema-drift
